## ═══════════════════════════════════════════════════════════════
## openvibe.cam — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.cam.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5160, systemd unit openvibe-cam) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in, the API and the camera writes, and
## compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the three public pages; private, no-store
## for a camera wall, a still, or anything drawn for a signed-in person). A photo is at most 12 MB; the body cap
## leaves room for its headers. Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=cam_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cam_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.cam www.openvibe.cam;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.cam$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.cam;

    ssl_certificate     /etc/letsencrypt/live/openvibe.cam/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.cam/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.cam$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.cam;

    ssl_certificate     /etc/letsencrypt/live/openvibe.cam/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.cam/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.cam.access.log;
    error_log  /var/log/nginx/openvibe.cam.error.log;

    # A photo is capped at 12 MB (CAM_PHOTO_MAX_BYTES); leave room for headers.
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=cam_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5160;
    }

    location /auth/ {
        limit_req zone=cam_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5160;
    }

    # ── API, camera pages and their forms ───────────────────
    location /api/ {
        limit_req zone=cam_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5160;
    }

    location /my/ {
        limit_req zone=cam_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5160;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5160/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' account delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5160/internal/events directly. Never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5160;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
