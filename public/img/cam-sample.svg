      <stop offset="0" stop-color="#3b5bb8"/>
      <stop offset=".45" stop-color="#e98a6b"/>
      <stop offset=".72" stop-color="#ffc56b"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a26e"/>
      <stop offset=".35" stop-color="#5f79b8"/>
      <stop offset="1" stop-color="#22345f"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
