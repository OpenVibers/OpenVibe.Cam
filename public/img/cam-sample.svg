      <stop offset=".55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="240" fill="url(#sky)"/>
  <circle cx="214" cy="118" r="46" fill="url(#sun)"/>
