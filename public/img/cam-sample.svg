<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <!-- Cam's sample picture: a ridge at golden hour, drawn rather than photographed so it shows no one. Its warm sky,
       blue water and green trees make every filter on the home page visibly different. -->
  <defs>
